<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="60%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <!-- Helix Ribbon Gradients -->
    <linearGradient id="helixCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="helixViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2.5"/>

  <!-- Orbital Reticle Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="3"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="4" stroke-dasharray="14 42" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- Central Glow Aura -->
  <circle cx="256" cy="256" r="110" fill="url(#centerAura)"/>

  <!-- Interlocking Molecular Double Helix Ribbon -->
  <!-- Back Arc (Violet) -->
  <path d="M 160 210 C 120 280, 150 360, 220 370 C 290 380, 360 310, 390 240"
        fill="none" stroke="url(#helixViolet)" stroke-width="28" stroke-linecap="round" opacity="0.85"/>

  <!-- Crossing Struts / Hydrogen Bonds -->
  <line x1="200" y1="210" x2="225" y2="302" stroke="rgba(56, 189, 248, 0.5)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/>
  <line x1="256" y1="180" x2="256" y2="332" stroke="rgba(168, 85, 247, 0.5)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/>
  <line x1="312" y1="210" x2="287" y2="302" stroke="rgba(56, 189, 248, 0.5)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- Front Arc (Cyan to Electric Blue) -->
  <path d="M 352 302 C 392 232, 362 152, 292 142 C 222 132, 152 202, 122 272"
        fill="none" stroke="url(#helixCyan)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Intersecting Secondary Loop -->
  <path d="M 160 330 C 210 390, 302 390, 352 330 C 402 270, 372 170, 302 140 C 232 110, 160 170, 160 230"
        fill="none" stroke="url(#helixCyan)" stroke-width="12" stroke-linecap="round" opacity="0.4"/>

  <!-- Glowing Atomic Nodes -->
  <circle cx="122" cy="272" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="122" cy="272" r="6" fill="#ffffff"/>

  <circle cx="390" cy="240" r="14" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="390" cy="240" r="6" fill="#ffffff"/>

  <circle cx="292" cy="142" r="10" fill="#38bdf8"/>
  <circle cx="220" cy="370" r="10" fill="#6366f1"/>

  <!-- Central Active Site Core Energy Node -->
  <circle cx="256" cy="256" r="18" fill="url(#coreGlow)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>
</svg>
